<html lang="uk">
<head>

  <meta name="referrer" content="no-referrer">

  else if (/[?&]k=/.test(location.search)) { document.title = "Світло вдома"; document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Світло вдома"; }</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7; --card: #ffffff; --line: #e4e6eb; --text: #1f2937; --muted: #6b7280;
      --seg: #ecedf1; --off: #182538; --offtext: #ffffff; --possible: #f6e7c3;
      --emerg: rgba(220, 38, 38, 0.32); --emergbg: #fef2f2; --emergline: #fecaca; --emergtext: #991b1b;
      --cur: #0085ff; --sock: #e8a317; --sb: #2f80ed; --bolt: #f2b93b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151c; --card: #1a2029; --line: #2a323f; --text: #e5e7eb; --muted: #9aa3b2;
        --seg: #262d38; --off: #3a4a66; --offtext: #ffffff; --possible: #4a4126;
        --emerg: rgba(248, 113, 113, 0.38); --emergbg: #3a1d1d; --emergline: #7f1d1d; --emergtext: #fecaca;
        --cur: #4da3ff; --sock: #f0b83a; --sb: #6aa6f5; --bolt: #f2b93b;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 12px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .card { max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
    .subs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
    .sub { flex: none; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
    .sub.active { background: var(--seg); font-weight: 600; }
    .weeks { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .wbtn { flex: none; width: 40px; height: 34px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; font-size: 14px; }
    .wbtn:disabled { opacity: .35; }
    .wlabel { font-size: 14.5px; font-weight: 600; text-align: center; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--seg); border-radius: 999px; padding: 4px; margin-bottom: 12px; }
    .day { border: 0; background: transparent; color: var(--text); padding: 7px 0; border-radius: 999px; font-size: 14.5px; }
    .day.active { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
    .day.empty { color: var(--muted); }
    .banner { display: none; gap: 10px; align-items: center; background: var(--emergbg); border: 1px solid var(--emergline); color: var(--emergtext); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.35; }
    .banner.show { display: flex; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .cell { position: relative; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 14.5px; }
    .half { position: absolute; top: 0; bottom: 0; width: 50%; }
    .half.l { left: 0; } .half.r { right: 0; }
    .half.off { background: var(--off); } .half.pos { background: var(--possible); }
    .cell .t { position: relative; z-index: 1; display: inline-flex; gap: 5px; align-items: center; }
    .cell.alloff .t { color: var(--offtext); }
    .split { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
    .split.l { clip-path: inset(0 50% 0 0); } .split.r { clip-path: inset(0 0 0 50%); }
    .split.w { color: var(--offtext); }
    .cell.current { box-shadow: 0 0 0 2px var(--card), 0 0 0 4.5px var(--cur); z-index: 2; }
    .em { position: absolute; top: 0; bottom: 0; background: var(--emerg); z-index: 0; }
    .empty-box { grid-column: 1 / -1; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--muted); font-size: 15px; padding: 0 16px; }
    .fact { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 10px; }
    .fact h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .bar { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12.5px; color: var(--muted); }
    .track { position: relative; height: 14px; border-radius: 7px; background: var(--seg); overflow: hidden; }
    .seg { position: absolute; top: 0; bottom: 0; }
    .nowline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--cur); z-index: 3; }
    .ticks { display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 11px; color: var(--muted); }
    .ticks div { display: flex; justify-content: space-between; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    .meta { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .nowb{display:none;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.35;border:1px solid var(--line);background:var(--card)}.nowb.show{display:block}.nowb b{display:block;font-size:17px;margin-bottom:2px}.nowb.on{border-color:var(--bolt)}.nowb.offc{background:var(--off);border-color:var(--off);color:var(--offtext)}.nowx{margin-top:4px;font-size:12.5px;opacity:.9}
.fund{max-width:460px;margin:12px auto 0}.fundbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}.fundh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:700}.fx{border:0;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}.fundp{font-size:14px;line-height:1.45;margin:10px 0 8px}.funds{font-size:13.5px;line-height:1.55}.fundt{display:flex;gap:8px;margin:12px 0}.fundt div{flex:1;background:var(--seg);border-radius:12px;padding:8px;font-size:12px;color:var(--muted)}.fundt b{display:block;font-size:15px;color:var(--text);margin-top:2px}.fundn{font-size:12.5px;color:var(--muted);margin-bottom:10px}.fundr{background:var(--seg);border-radius:12px;padding:10px;font-size:13px;line-height:1.5}.fundr small{display:block;color:var(--muted);font-size:12px}.fundi{display:flex;gap:6px;align-items:center;margin:6px 0}.fundi code{flex:1;font-size:12px;background:var(--card);border-radius:8px;padding:6px;word-break:break-all;user-select:text;-webkit-user-select:text}.fbtn{border:0;border-radius:12px;padding:11px;font-size:14px;background:var(--off);color:var(--offtext)}.fbtn.sm{border-radius:8px;padding:6px 8px;font-size:12px}.fbtn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.fundb{display:flex;gap:8px;margin-top:12px}.fundb .fbtn{flex:1}.fundstrip{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--text);text-align:left}
.blb{display:none;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.35;border:1px solid var(--line);background:var(--card)}.blb.show{display:block}.blb b{display:block;font-size:15px;margin-bottom:2px}.track.blt{height:30px;border-radius:8px}.blt svg{position:absolute;left:0;top:0;width:100%;height:100%}:root{--blt:#22a861}
.tabs{max-width:460px;margin:0 auto 10px;display:flex;gap:4px;background:var(--seg);border-radius:999px;padding:4px}.tabs button{flex:1;border:0;background:transparent;color:var(--text);padding:8px 0;border-radius:999px;font-size:14.5px}.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}.kt{border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}.kt b{font-size:21px;line-height:1.15}.kt span{font-size:12.5px;color:var(--muted)}.kt small{font-size:11.5px;color:var(--muted);opacity:.85}.kt.bad b{color:#d14343}.kt.blt b{color:var(--blt)}
.hh{margin:6px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}.hh small{font-weight:400;opacity:.8;margin-left:4px}
.dbars{display:flex;gap:3px;align-items:flex-end;height:118px;border-bottom:1px solid var(--line);margin-bottom:6px}.dcol{flex:1;min-width:0;border:0;background:transparent;padding:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;color:var(--muted)}.dpair{flex:1;width:100%;display:flex;gap:1px;align-items:flex-end;justify-content:center}.dpair i{display:block;width:44%;max-width:9px;border-radius:3px 3px 0 0;min-height:1px}.dp{background:var(--off);opacity:.45}.df{background:var(--sb)}.dcol span{font-size:9.5px;line-height:14px}.dcol.today span{color:var(--cur);font-weight:700}.dcol em{position:absolute;top:0;font-style:normal;font-size:10px;font-weight:700;color:#d14343}
.heat{display:grid;grid-template-columns:20px repeat(24,1fr);gap:1.5px;margin-top:4px}.hx{font-size:9px;color:var(--muted);height:12px;overflow:visible;white-space:nowrap}.hy{border:0;background:transparent;padding:0;font-size:9.5px;color:var(--muted);text-align:left;line-height:11px}.hy.av{font-weight:700}.hc{display:block;height:11px;border-radius:2px;background:color-mix(in srgb,var(--sb) calc(var(--a)*100%),var(--seg))}.hc.na{background:transparent;border:1px dashed var(--line)}
.hnote{font-size:11.5px;color:var(--muted);margin:8px 0 12px;line-height:1.35}
.blist>div{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;font-size:12px;margin-bottom:5px;color:var(--muted)}.bbar{height:8px;background:var(--seg);border-radius:4px;overflow:hidden}.bbar i{display:block;height:100%;background:var(--blt);border-radius:4px}
</style>
</head>
<body>
  <div id="tabs" class="tabs" style="display:none"><button data-t="g" class="on">📅 Графік</button><button data-t="h">📊 Історія</button></div>
  <div id="mainc" class="card">
    <div id="subs" class="subs"></div>
    <div id="weeks" class="weeks" style="display:none">
      <button id="wprev" class="wbtn" aria-label="Попередній тиждень">◀</button>
      <span id="wlabel" class="wlabel"></span>
      <button id="wnext" class="wbtn" aria-label="Наступний тиждень">▶</button>
    </div>
    <div id="days" class="days"></div>
    <div id="banner" class="banner"><span style="font-size:20px">🚨</span><div id="banner-text"></div></div>
    <div id="nowb" class="nowb"></div>
    <div id="blb" class="blb"></div>
<div id="grid" class="grid"></div>
    <div id="fact" class="fact" style="display:none"></div>
    <div id="legend" class="legend"></div>
    <div class="meta"><span id="m1"></span><span id="m2"></span></div>
  </div>

<div id="histc" class="card" style="display:none"></div>
<div id="fund" class="fund"></div>

<script>
const API = "https://hikzqzdulvekuplolymw.supabase.co/functions/v1/outage-app";
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const KEY = (new URLSearchParams(location.search).get("k") || "").trim();
let DATA = null, subIdx = 0, dayIdx = 0, WEEK = 0, busy = false, lastLoad = 0;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (m) => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
const dur = (m) => { const h = Math.floor(m / 60), x = m % 60; return (h ? h + " год" : "") + (h && x ? " " : "") + (x || !h ? x + " хв" : ""); };
const sum = (a) => a.reduce((s, [x, y]) => s + (y - x), 0);
const overlap = (a, x, y) => a.some(([s, e]) => Math.max(s, x) < Math.min(e, y));
const dm = (iso) => iso.slice(8, 10) + "." + iso.slice(5, 7);
const kyivMinutes = (t) => {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Kyiv", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(t || Date.now()));
  return parseInt(p.find(x => x.type === "hour").value, 10) % 24 * 60 + parseInt(p.find(x => x.type === "minute").value, 10);
};

function msg(icon, text) {
  const box = document.createElement("div");
  box.className = "empty-box";
  const i = document.createElement("div"); i.style.fontSize = "30px"; i.textContent = icon;
  const t = document.createElement("div"); t.textContent = text;
  box.append(i, t);
  $("grid").replaceChildren(box);
  $("subs").innerHTML = ""; $("days").innerHTML = ""; $("weeks").style.display = "none"; $("fact").style.display = "none"; $("legend").innerHTML = "";
  $("m1").textContent = ""; $("m2").textContent = ""; $("banner").className = "banner";
}

function boltOn() { return '<svg width="12" height="15" viewBox="0 0 16 20" fill="var(--bolt)"><path d="M9.5 1L2 11h6l-1.5 8L14 9H8l1.5-8z"/></svg>'; }
function boltOff() { return '<svg width="13" height="15" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L3 11h5.5L7 18l7.5-9H9l1-7z"/><line x1="2" y1="3" x2="16" y2="17"/></svg>'; }

function render() {
  if (!DATA) return;
  const sub = DATA.subs[subIdx];
  const day = sub.days[dayIdx];
  const isToday = day.date === DATA.today;
  const nowMin = kyivMinutes();

  // підписки
  $("subs").innerHTML = "";
  if (DATA.subs.length > 1) {
    DATA.subs.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "sub" + (i === subIdx ? " active" : "");
      b.textContent = s.title.replace(/^[^\p{L}\p{N}]+/u, "");
      b.onclick = () => { subIdx = i; render(); };
      $("subs").appendChild(b);
    });
  }
  // тиждень
  $("weeks").style.display = "flex";
  $("wlabel").textContent = "Тиждень " + dm(sub.days[0].date) + "–" + dm(sub.days[6].date);
  const hasW = typeof DATA.week === "number";
  $("wprev").disabled = busy || !hasW || DATA.week <= DATA.week_min;
  $("wnext").disabled = busy || !hasW || DATA.week >= DATA.week_max;
  // дні
  $("days").innerHTML = "";
  sub.days.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "day" + (i === dayIdx ? " active" : (d.nodata || (!d.known && !d.emergency && !d.emerg.length) ? " empty" : ""));
    b.textContent = DAYS[i];
    b.onclick = () => { dayIdx = i; render(); };
    $("days").appendChild(b);
  });
  // банер екстрених
  const em = day.emerg || [];
  const showEm = day.emergency || em.length > 0;
  $("banner").className = "banner" + (showEm ? " show" : "");
  if (showEm) {
    const ranges = em.map(([s, e], i) => hhmm(s) + "–" + (day.emergency && isToday && i === em.length - 1 ? "зараз" : hhmm(e % 1440 === 0 && e > 0 ? 1440 : e))).join(", ");
    $("banner-text").innerHTML = day.emergency
      ? "<b>Діють екстрені відключення</b>" + (ranges ? ": " + ranges : "") + ". Графік може не діяти."
      : "<b>Цього дня були екстрені відключення:</b> " + ranges + ".";
  }
  // стан зараз (лише будинкова версія, лише для сьогодні)
const nb = $("nowb");
nb.className = "nowb";
nb.replaceChildren();
if (DATA.house && isToday) {
const fm = kyivMinutes(DATA.now);
const sbOff = (day.sb || []).some(([s, e]) => s <= fm && e >= fm - 1);
const planKnown = day.known && !day.emergency;
const planOff = planKnown && overlap(day.plan, fm, fm + 1);
const on = !sbOff;
let sub2;
if (day.emergency) sub2 = "Svitlobot (Ввід 1): " + (sbOff ? "вимкнено" : "є") + " · діють екстрені відключення";
else if (!planKnown) sub2 = "за Svitlobot (Ввід 1)";
else if (!planOff && !sbOff) sub2 = "за графіком і за Svitlobot (Ввід 1)";
else if (!planOff && sbOff) sub2 = "Svitlobot (Ввід 1): вимкнено · за графіком мало б бути";
else if (planOff && sbOff) sub2 = "за графіком і за Svitlobot (Ввід 1)";
else sub2 = "Svitlobot (Ввід 1): є · за графіком мало б не бути";
const hm2 = (m) => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
let since = "";
const sl = DATA.sb_last;
if (sl && sl.at && (sl.kind === "off") === sbOff && DATA.now - sl.at < 20 * 3600000) since = " з " + hm2(kyivMinutes(sl.at));
const b = document.createElement("b"); b.textContent = (on ? "💡 Світло є" : "🌑 Світла немає") + since;
const d2 = document.createElement("div"); d2.textContent = sub2;
nb.append(b, d2);
// наступна зміна за графіком (з урахуванням завтра, якщо він у цьому тижні)
let nxt = "";
if (planKnown) {
  const tmr = sub.days[dayIdx + 1];
  const tk = !!(tmr && tmr.known && !tmr.emergency);
  const mg = [];
  day.plan.concat(tk ? tmr.plan.map(([x, y]) => [x + 1440, y + 1440]) : []).slice().sort((x, y) => x[0] - y[0])
    .forEach(([x, y]) => { const l = mg[mg.length - 1]; if (l && x <= l[1]) l[1] = Math.max(l[1], y); else mg.push([x, y]); });
  const cur = mg.find(([x, y]) => x <= fm && y > fm);
  if (cur) nxt = cur[1] >= 1440 && !tk ? "За графіком без світла до кінця доби" : "За графіком світло з'явиться о " + hm2(cur[1]) + " (через " + dur(cur[1] - fm) + ")";
  else if (!sbOff) { const n = mg.find(([x]) => x > fm); if (n) nxt = "Наступне відключення за графіком о " + hm2(n[0]) + (n[0] >= 1440 ? " завтра" : "") + " (через " + dur(n[0] - fm) + ")"; else if (!tk) nxt = "Сьогодні відключень за графіком більше немає"; }
}
if (nxt) { const d3 = document.createElement("div"); d3.className = "nowx"; d3.textContent = "⏭ " + nxt; nb.append(d3); }
if (DATA.sb_ok && DATA.now - DATA.sb_ok > 15 * 60000) { const d4 = document.createElement("div"); d4.className = "nowx"; d4.textContent = "⚠️ Svitlobot не перевірявся " + dur(Math.round((DATA.now - DATA.sb_ok) / 60000)) + ", стан може бути неточним"; nb.append(d4); }
nb.className = "nowb show " + (on ? "on" : "offc");
}
// Bluetti (лише версія FamilyBot для Антона й Ксенії, підписка дому, сьогодні)
const bb = $("blb");
bb.className = "blb";
bb.replaceChildren();
const BL = DATA.bl;
if (BL && sub.fact && isToday) {
  const age = Math.max(0, Math.round((DATA.now - (BL.at || 0)) / 60000));
  let t1;
  if (!BL.fresh) t1 = "🔋 Bluetti: дані недоступні (" + dur(age) + " тому)" + (BL.last_soc != null ? " · останній заряд " + BL.last_soc + "%" : "");
  else if (!BL.online) t1 = "🔋 Bluetti вимкнено" + (BL.last_soc != null ? " · останній заряд " + BL.last_soc + "%" : "");
  else if (BL.src === "bluetti") t1 = "🔋 Bluetti " + BL.soc + "% · живить квартиру · " + (BL.acw || 0) + " Вт";
  else if ((BL.grid || 0) > 5) t1 = "🔋 Bluetti " + BL.soc + "% · заряджається (" + BL.grid + " Вт)";
  else t1 = "🔋 Bluetti " + BL.soc + "% · увімкнено, не заряджається";
  const b1 = document.createElement("b"); b1.textContent = t1; bb.append(b1);
  if (BL.eta) BL.eta.replace(/^\s*·\s*/, "").split("\n").filter(Boolean).forEach((t) => { const x = document.createElement("div"); x.className = "nowx"; x.textContent = t.charAt(0).toUpperCase() + t.slice(1); bb.append(x); });
